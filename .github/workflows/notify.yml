name: dtek-notify

on:
  schedule:
    - cron: "12,42 * * * *"     # Runs at 12 and 42 minutes past the hour
  workflow_dispatch:
    inputs:
      stub:
        description: "Заглушка StubDtekClient (без запросов к DTEK)"
        type: boolean
        default: false
      show_browser:
        description: "Chromium не headless (xvfb)"
        type: boolean
        default: false
      dry_run:
        description: "Не отправлять в Telegram, печатать текст в лог"
        type: boolean
        default: false
      force:
        description: "Отправить, даже если график не изменился"
        type: boolean
        default: true
      debug:
        description: "Подробный лог"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dtek-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore last-sent state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: dtek-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dtek-state-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          playwright install --with-deps chromium

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DTEK_SITE: ${{ secrets.DTEK_SITE }}
          DTEK_CITY: ${{ secrets.DTEK_CITY }}
          DTEK_STREET: ${{ secrets.DTEK_STREET }}
          DTEK_HOUSE: ${{ secrets.DTEK_HOUSE }}
          DTEK_STUB: ${{ inputs.stub && '1' || '0' }}
          DTEK_SHOW_BROWSER: ${{ inputs.show_browser && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE_SEND: ${{ inputs.force && '1' || '0' }}
          DTEK_DEBUG: ${{ inputs.debug && '1' || '0' }}
          STATE_FILE: .state/last.json
        run: |
          if [ "$DTEK_SHOW_BROWSER" = "1" ]; then
            xvfb-run -a python scripts/notify.py
          else
            python scripts/notify.py
          fi

      - name: Save last-sent state
        if: always() && hashFiles('.state/last.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: dtek-state-${{ github.run_id }}-${{ github.run_attempt }}
